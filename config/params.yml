# =============================================================================
# LANCO / RUN29 — Pipeline COI metabarcoding (Leray-XT + DADA2 + BOLD/NCBI)
# Workshop "Microbiome amplicon workshop design"
# =============================================================================
# *** ESTRATEGIA ACTIVA 2026-06-23: SINGLE-END R1 (Solución 2 deep-research) ***
# El R2 de MiSeq 2×301 colapsa después del ciclo ~180; intento PE con
# justConcatenate retuvo solo ~30 % de reads (ver params_PE.yml + log PE).
# Esta versión usa SOLO R1 con truncLen=220 para amplicon Leray-XT 5' (213 nt
# biológicamente continuo) → permite NUMT-screen por traducción.
#
# Cualquier script del workflow lee este archivo (R: yaml::read_yaml).
# Snapshot anterior PE preservado en: config/params_PE.yml

project:
  name: LANCO_RUN29_COI
  run_id: RUN29
  sequencer: Illumina MiSeq M03978
  read_config: 2x301 paired-end
  date_created: 2026-06-17

paths:
  # Todas relativas a la raíz del repo (LANCO/)
  raw_reads:    RUN29
  # Mapping file FILTRADO a las 38 muestras L (COI Leray-XT).
  # Backup del archivo original: metadata/samples_RUN29.tsv.bak_YYYYMMDD
  metadata:     metadata/samples_RUN29_COI.tsv
  results:      results
  logs:         logs
  cutadapt_out:   results/02_cutadapt
  filtered_out:   results/03_dada2/filtered
  dada2_out:      results/03_dada2
  dada2_se_out:   results/03_dada2_SE       # input para 05_swarm_LULU
  swarm_lulu_out: results/05_swarm_lulu     # OTUs curados (post-Brandt 2021)
  taxonomy_out:   results/04_taxonomy
  db_dir:         db
  rescript_dir:   db/rescript

# --- Primers Leray-XT (Wangensteen et al. 2018) -------------------------------
# Estos son los primers usados en RUN29 (confirmado por inspección de FASTQ).
primers:
  fwd_name: mlCOIintF
  fwd_seq:  GGWACWGGWTGAACWGTWTAYCCYCC      # 26 nt, degenerada
  rev_name: jgHCO2198
  rev_seq:  TANACYTCNGGRTGNCCRAARAAYCA      # 26 nt, degenerada
  amplicon_expected_bp: 313                  # tamaño esperado del amplicón

# --- Cutadapt (paso 02) -------------------------------------------------------
cutadapt:
  min_length: 50           # descarta reads muy cortos post-trimming
  error_rate: 0.15         # 15 % por la alta degeneración de COI
  discard_untrimmed: true  # tira reads sin primer (señal de off-target)
  cores: 4

# --- DADA2: filterAndTrim (paso 03) -------------------------------------------
# ESTRATEGIA SINGLE-END (Solución 2): solo R1.
#
# Justificación:
#   - R2 MiSeq 2×301 colapsa Q<20 después del ciclo ~180 (kit v3 endémico).
#   - Intento PE con justConcatenate retuvo solo ~30 % (params_PE.yml).
#   - R1 mantiene Q>=20 sostenido hasta posición ~220 post-cutadapt (calidad alta).
#   - Endorse oficial DADA2 (Callahan, GitHub #176): "single read approach is
#     better than using bad quality overlaps".
#
# Trade-off aceptado:
#   - Amplicón Leray completo = 313 nt; con R1 only obtenemos los 213 nt 5' del
#     fragmento (truncLen 220 - primer 26 nt ya removido por cutadapt + algo de
#     wobble). Suficiente para género/familia con BOLD/NCBI; pierde resolución
#     filogenética intra-especie en el 3' del amplicón.
#   - Ventaja: ASV biológicamente continuo → NUMT-screen por traducción REACTIVO.
filter_and_trim:
  # CAMBIO 2026-06-23 v2: truncLen=220 + maxEE=2 dio 0.7 % retención.
  # Evidencia: el R1 también colapsa después de pos ~140 (no solo R2).
  # Ajuste data-driven: truncLen=180 (anclado a Q sostenido real del R1) +
  # maxEE=3 (tolera la acumulación de errores en los 180 nt). Esperamos
  # retención >70 % manteniendo amplicón ≥170 nt (sirve para BOLD asignación).
  truncLen_R1: 180         # POST-cutadapt; ajustado a colapso real del R1
  truncLen_R2: 0           # IGNORADO en pipeline SE
  maxN: 0
  maxEE_R1: 3              # relajado de 2 → 3 para compensar truncLen mayor
  maxEE_R2: 5              # IGNORADO en pipeline SE
  truncQ: 2                # default DADA2; maxEE gobierna QC
  rm_phix: true
  multithread: true

# --- DADA2: learnErrors + dada (paso 03) --------------------------------------
dada2_inference:
  pool: pseudo             # pseudo-pooling: balance sensibilidad/tiempo
  OMEGA_A: 1e-40           # default DADA2 — ajustar solo si justificas
  multithread: true

# --- DADA2: mergePairs --------------------------------------------------------
# *** IGNORADO en pipeline SINGLE-END *** (no hay R2 que mergear).
# Bloque conservado para que el script PE de respaldo siga parseando el YAML.
merge_pairs:
  justConcatenate: true    # IGNORADO en SE
  minOverlap: 12           # IGNORADO en SE
  maxMismatch: 0           # IGNORADO en SE

# --- DADA2: removeBimeraDenovo -----------------------------------------------
chimera:
  method: consensus

# --- COI-specific post-processing --------------------------------------------
# Single-end: el ASV ES biológicamente continuo (R1 only, sin linker N).
# → Reactivamos el NUMT-screen por traducción (código genético 5 invertebrado).
# Longitud esperada ASV ≈ truncLen_R1 = 220 nt ± wobble por chimera removal.
coi_filtering:
  apply_translation_check: true    # REACTIVADO en single-end (ORF continuo)
  genetic_code: 5                  # NCBI table 5 (invertebrate mitochondrial)
  frame: auto
  min_length: 170                  # truncLen_R1 180 ± 10
  max_length: 185

# --- Taxonomía: BOLD + NCBI vía RESCRIPt --------------------------------------
# Estrategia (reemplaza MIDORI2): construir DOS DBs curadas con RESCRIPt
# siguiendo los tutoriales oficiales del foro QIIME2:
#   - BOLD:  https://forum.qiime2.org/t/building-a-coi-database-from-bold-references/16129
#   - NCBI:  https://forum.qiime2.org/t/building-a-coi-database-from-ncbi-references/16500
#
# Estos pipelines se ejecutan UNA SOLA VEZ (paso 04a y 04b) y producen los
# artefactos .qza que luego se exportan a FASTA/TSV consumibles por DADA2.
#
# El paso 04 (asignación) ofrece tres estrategias seleccionables:
#   1) Naive Bayes en QIIME2 (classify-sklearn) — mejor para BOLD curada
#   2) VSEARCH consensus (classify-consensus-vsearch) — robusto a gaps
#   3) DADA2 assignTaxonomy() en R — más simple, no requiere QIIME2 en infer
taxonomy:
  strategy: vsearch_consensus      # naive_bayes | vsearch_consensus | dada2_R
  primary_db:   bold               # BOLD primero (mejor cobertura de metazoos)
  secondary_db: ncbi               # NCBI para huérfanos de BOLD

  # --- BOLD vía RESCRIPt ---------------------------------------------------
  bold:
    enabled: true
    rescript_marker: COI-5P
    # Taxa a descargar (filtros BOLD). Para LANCO oceanográfico:
    # Metazoa + Algae + Fungi cubre el espectro esperable en eDNA marino.
    taxa:
      - Metazoa
      - Algae
      - Fungi
    # Filtros de curado (RESCRIPt cull-seqs / filter-seqs)
    min_length: 250                # COI 313 ± wobble, descartar fragmentos
    max_length: 1600               # full-length COI hasta ~1500 nt
    max_ambig: 5                   # descartar seqs con >5 N
    # Dereplicación
    dereplicate_mode: uniq         # uniq | lca | majority
    # Salidas
    seqs_qza: db/rescript/bold-coi-seqs.qza
    tax_qza:  db/rescript/bold-coi-tax.qza
    classifier_qza: db/rescript/bold-coi-classifier.qza
    seqs_fasta: db/rescript/bold-coi-seqs.fasta        # export para DADA2/VSEARCH
    tax_tsv:    db/rescript/bold-coi-tax.tsv

  # --- NCBI vía RESCRIPt ---------------------------------------------------
  ncbi:
    enabled: true
    # Query Entrez para COI completo (mitocondrial), excluye predicted/incomplete
    entrez_query: >-
      (COI[Title] OR COX1[Title] OR CO1[Title] OR
       "cytochrome c oxidase subunit 1"[Title] OR
       "cytochrome oxidase subunit 1"[Title])
      AND 250:1600[SLEN]
      NOT (environmental samples[ORGN] OR unclassified[ORGN])
    ranks: ["superkingdom","phylum","class","order","family","genus","species"]
    min_length: 250
    max_length: 1600
    max_ambig: 5
    dereplicate_mode: uniq
    seqs_qza: db/rescript/ncbi-coi-seqs.qza
    tax_qza:  db/rescript/ncbi-coi-tax.qza
    classifier_qza: db/rescript/ncbi-coi-classifier.qza
    seqs_fasta: db/rescript/ncbi-coi-seqs.fasta
    tax_tsv:    db/rescript/ncbi-coi-tax.tsv

  # --- Clasificación ASVs --------------------------------------------------
  classification:
    # parámetros para classify-consensus-vsearch
    perc_identity: 0.85
    maxaccepts: 10
    min_consensus: 0.51
    threads: 8
    # parámetros para DADA2 assignTaxonomy (fallback en R)
    dada2_minBoot: 80
    dada2_tryRC: true

# --- Paso 05: swarm clustering + LULU curation (Brandt et al. 2021) ----------
# Justificación: DADA2 trata cada nucleótido del codón como equivalente y puede
# sobre-llamar variantes en marcadores codificantes (COI). Antich 2021 y Brandt
# 2021 demuestran que la curación post-DADA2 con swarm (clustering basado en
# diferencias locales) + LULU (eliminación de ASVs espurios por co-ocurrencia
# + similitud) produce inventarios biodiversidad más cercanos a referencia
# morfológica. Ejemplo benchmark: Brandt 2021 (Mol Ecol Resour) sobre 42
# muestras sedimento abisal con marcador COI Leray.
#
# Pipeline:
#   asvs.fasta → swarm (clustering local d=13)  → OTU seeds + member-mapping
#   asv_table  → colapso por cluster            → otu_table_swarm.tsv
#   seeds + otu_table → vsearch usearch_global  → match_list (84% identity)
#   otu_table + match_list → LULU::lulu()       → curated_otu_table.tsv
#
# DEPENDENCIAS EXTERNAS:
#   - swarm   v3+   (Mahé et al. 2014; https://github.com/torognes/swarm)
#   - vsearch v2+   (https://github.com/torognes/vsearch)
#   - R-pkg  lulu   (devtools::install_github("tobiasgf/lulu"))
swarm_lulu:
  swarm:
    enabled: true
    d: 13                     # max differences allowed within cluster
                              # Brandt 2021 marine metazoo: 13
                              # alt fastidious: d=1 (Mahé default; más conservador)
    fastidious: false         # requiere d=1; ignorado si d>1
    threads: 4
  vsearch:
    threads: 4
    iddef: 1                  # identidad = matches/(matches+mismatches+indels)
    min_match_pct: 84         # umbral inferior para incluir pairs en match_list
  lulu:
    enabled: true
    minimum_match: 84         # % identidad para considerar daughter del parent
    minimum_relative_cooccurence: 0.95  # daughter co-ocurre ≥95% donde parent
    minimum_ratio_type: "min" # "min" (estricto) | "avg" (más permisivo)
    minimum_ratio: 1          # parent_abund ≥ daughter_abund × ratio

# --- Recursos de cómputo ------------------------------------------------------
compute:
  cores_total: 8
  memory_gb: 32
